<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geopolitics RSS Monitor | Cross-Verification Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #0a0e1a;
        --bg-secondary: #111827;
        --bg-tertiary: #1f2937;
        --bg-card: #1a1f2e;
        --border-color: #2d3748;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-blue: #3b82f6;
        --accent-purple: #8b5cf6;
        --accent-red: #ef4444;
        --accent-orange: #f59e0b;
        --accent-green: #10b981;
        --bias-western: #3b82f6;
        --bias-eastern: #ef4444;
        --bias-nonwestern: #10b981;
        --bias-analytical: #8b5cf6;
        --bias-wire: #f59e0b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
      }

      .mono {
        font-family: "JetBrains Mono", monospace;
      }

      /* Layout */
      .app-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .header {
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(10px);
      }

      .header-content {
        max-width: 1440px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(
          135deg,
          var(--accent-blue),
          var(--accent-purple)
        );
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .logo-text {
        font-weight: 700;
        font-size: 1.125rem;
        letter-spacing: -0.025em;
      }

      .logo-badge {
        background: var(--bg-tertiary);
        color: var(--text-muted);
        font-size: 0.75rem;
        padding: 0.125rem 0.5rem;
        border-radius: 9999px;
        border: 1px solid var(--border-color);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .search-bar {
        position: relative;
        width: 320px;
      }

      .search-bar input {
        width: 100%;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.5rem 1rem 0.5rem 2.5rem;
        color: var(--text-primary);
        font-size: 0.875rem;
        transition: all 0.2s;
      }

      .search-bar input:focus {
        outline: none;
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .search-bar input::placeholder {
        color: var(--text-muted);
      }

      .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
      }

      .header-stats {
        display: flex;
        gap: 1.5rem;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .header-stat {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .stat-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-green);
      }

      .stat-dot.live {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Main Content */
      .main-content {
        flex: 1;
        max-width: 1440px;
        margin: 0 auto;
        padding: 1.5rem 2rem;
        width: 100%;
      }

      /* Filter Bar */
      .filter-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .filter-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      .filter-btn {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        padding: 0.375rem 0.75rem;
        border-radius: 6px;
        font-size: 0.8125rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .filter-btn:hover {
        background: var(--bg-card);
        border-color: var(--text-muted);
      }

      .filter-btn.active {
        border-color: var(--accent-blue);
        color: var(--accent-blue);
        background: rgba(59, 130, 246, 0.1);
      }

      .filter-btn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .filter-btn .dot.western {
        background: var(--bias-western);
      }
      .filter-btn .dot.eastern {
        background: var(--bias-eastern);
      }
      .filter-btn .dot.nonwestern {
        background: var(--bias-nonwestern);
      }
      .filter-btn .dot.analytical {
        background: var(--bias-analytical);
      }
      .filter-btn .dot.wire {
        background: var(--bias-wire);
      }

      .view-toggle {
        display: flex;
        background: var(--bg-tertiary);
        border-radius: 8px;
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      .view-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-size: 0.8125rem;
        transition: all 0.2s;
      }

      .view-btn.active {
        background: var(--accent-blue);
        color: white;
      }

      /* Dashboard Grid */
      .dashboard-grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 1.5rem;
      }

      @media (max-width: 1024px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Sidebar */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .sidebar-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1rem;
      }

      .sidebar-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 0.75rem;
        font-weight: 600;
      }

      .perspective-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .perspective-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.625rem 0.75rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .perspective-item:hover {
        background: var(--bg-tertiary);
      }

      .perspective-item.active {
        background: rgba(59, 130, 246, 0.1);
      }

      .perspective-left {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }

      .perspective-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .perspective-name {
        font-size: 0.875rem;
        font-weight: 500;
      }

      .perspective-count {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--bg-tertiary);
        padding: 0.125rem 0.5rem;
        border-radius: 9999px;
      }

      .event-clusters {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .cluster-item {
        padding: 0.625rem;
        border-radius: 8px;
        background: var(--bg-tertiary);
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid transparent;
      }

      .cluster-item:hover {
        border-color: var(--accent-blue);
      }

      .cluster-item.active {
        border-color: var(--accent-blue);
        background: rgba(59, 130, 246, 0.1);
      }

      .cluster-title {
        font-size: 0.8125rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
        line-height: 1.4;
      }

      .cluster-meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.6875rem;
        color: var(--text-muted);
      }

      .cluster-sources {
        display: flex;
        gap: 0.25rem;
      }

      .cluster-source-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      /* Article Feed */
      .feed-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .article-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.25rem;
        transition: all 0.2s;
        cursor: pointer;
      }

      .article-card:hover {
        border-color: var(--text-muted);
        transform: translateY(-1px);
      }

      .article-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      .article-source {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .source-avatar {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 600;
        color: white;
      }

      .source-avatar.aljazeera {
        background: #c8952e;
      }
      .source-avatar.tass {
        background: #1a5276;
      }
      .source-avatar.bbc {
        background: #bb1919;
      }
      .source-avatar.reuters {
        background: #ff8000;
      }

      .source-info {
        display: flex;
        flex-direction: column;
      }

      .source-name {
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .source-meta {
        font-size: 0.6875rem;
        color: var(--text-muted);
      }

      .article-bias-badge {
        font-size: 0.6875rem;
        padding: 0.25rem 0.625rem;
        border-radius: 9999px;
        font-weight: 500;
        text-transform: capitalize;
      }

      .article-bias-badge.western {
        background: rgba(59, 130, 246, 0.15);
        color: var(--bias-western);
      }

      .article-bias-badge.eastern {
        background: rgba(239, 68, 68, 0.15);
        color: var(--bias-eastern);
      }

      .article-bias-badge.non_western {
        background: rgba(16, 185, 129, 0.15);
        color: var(--bias-nonwestern);
      }

      .article-bias-badge.wire {
        background: rgba(245, 158, 11, 0.15);
        color: var(--bias-wire);
      }

      .article-title {
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.5;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
      }

      .article-description {
        font-size: 0.875rem;
        color: var(--text-secondary);
        line-height: 1.6;
        margin-bottom: 0.75rem;
      }

      .article-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .article-tags {
        display: flex;
        gap: 0.375rem;
        flex-wrap: wrap;
      }

      .article-tag {
        font-size: 0.6875rem;
        padding: 0.125rem 0.5rem;
        border-radius: 4px;
        background: var(--bg-tertiary);
        color: var(--text-muted);
        border: 1px solid var(--border-color);
      }

      .article-time {
        font-size: 0.75rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      /* Comparison View */
      .comparison-view {
        display: none;
      }

      .comparison-view.active {
        display: block;
      }

      .comparison-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1rem;
      }

      .comparison-column {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
      }

      .comparison-header {
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .comparison-header .perspective-dot {
        width: 12px;
        height: 12px;
      }

      .comparison-header h3 {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .comparison-articles {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .comparison-article {
        padding: 0.75rem;
        background: var(--bg-tertiary);
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .comparison-article-title {
        font-size: 0.8125rem;
        font-weight: 500;
        margin-bottom: 0.375rem;
        line-height: 1.4;
      }

      .comparison-article-desc {
        font-size: 0.75rem;
        color: var(--text-secondary);
        line-height: 1.5;
      }

      .framing-indicator {
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--border-color);
        font-size: 0.6875rem;
        color: var(--text-muted);
      }

      .framing-indicator strong {
        color: var(--accent-purple);
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-muted);
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.5;
      }

      .empty-state h3 {
        font-size: 1.125rem;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
      }

      /* Loading Skeleton */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--bg-tertiary) 25%,
          var(--bg-card) 50%,
          var(--bg-tertiary) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 6px;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .skeleton-title {
        height: 1.25rem;
        width: 80%;
        margin-bottom: 0.5rem;
      }

      .skeleton-text {
        height: 0.875rem;
        width: 100%;
        margin-bottom: 0.375rem;
      }

      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        max-width: 720px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-header {
        padding: 1.25rem;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-header h2 {
        font-size: 1rem;
        font-weight: 600;
      }

      .modal-close {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1.25rem;
        padding: 0.25rem;
      }

      .modal-body {
        padding: 1.25rem;
      }

      .modal-article-source {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .modal-title {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 1rem;
      }

      .modal-description {
        font-size: 0.9375rem;
        color: var(--text-secondary);
        line-height: 1.7;
        margin-bottom: 1rem;
      }

      .modal-meta {
        display: flex;
        gap: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
        font-size: 0.8125rem;
        color: var(--text-muted);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--bg-tertiary);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .header-content {
          flex-wrap: wrap;
        }

        .search-bar {
          width: 100%;
          order: 3;
        }

        .header-stats {
          display: none;
        }

        .filter-bar {
          flex-direction: column;
          align-items: flex-start;
        }

        .main-content {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <div class="logo">
            <div class="logo-icon">🌍</div>
            <span class="logo-text">Geopolitics Monitor</span>
            <span class="logo-badge mono">v1.0</span>
          </div>

          <div class="search-bar">
            <svg
              class="search-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Search articles, events, sources..."
            />
          </div>

          <div class="header-stats">
            <div class="header-stat">
              <span class="stat-dot live"></span>
              <span id="liveCount">0 articles</span>
            </div>
            <div class="header-stat">
              <span>Updated <span id="lastUpdated">just now</span></span>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <span class="filter-label">Perspective:</span>
            <button class="filter-btn active" data-filter="all">
              All Sources
            </button>
            <button class="filter-btn" data-filter="wire">
              <span class="dot wire"></span>
              Wire
            </button>
            <button class="filter-btn" data-filter="western">
              <span class="dot western"></span>
              Western
            </button>
            <button class="filter-btn" data-filter="non_western">
              <span class="dot nonwestern"></span>
              Non-Western
            </button>
            <button class="filter-btn" data-filter="eastern">
              <span class="dot eastern"></span>
              Eastern
            </button>
          </div>

          <div class="view-toggle">
            <button class="view-btn active" data-view="feed">📋 Feed</button>
            <button class="view-btn" data-view="comparison">⚖️ Compare</button>
          </div>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
          <!-- Sidebar -->
          <aside class="sidebar">
            <div class="sidebar-card">
              <div class="sidebar-title">Sources by Perspective</div>
              <div class="perspective-list" id="perspectiveList">
                <!-- Populated by JS -->
              </div>
            </div>

            <div class="sidebar-card">
              <div class="sidebar-title">Event Clusters</div>
              <div class="event-clusters" id="eventClusters">
                <!-- Populated by JS -->
              </div>
            </div>

            <div class="sidebar-card">
              <div class="sidebar-title">Bias Distribution</div>
              <div
                id="biasDistribution"
                style="display: flex; flex-direction: column; gap: 0.5rem"
              >
                <!-- Populated by JS -->
              </div>
            </div>
          </aside>

          <!-- Feed Container -->
          <div class="feed-container" id="feedContainer">
            <!-- Articles populated by JS -->
          </div>

          <!-- Comparison View -->
          <div class="comparison-view" id="comparisonView">
            <div class="comparison-grid" id="comparisonGrid">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Article Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2>Article Details</h2>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <script>
      // Mock data matching the n8n workflow output structure
      const mockArticles = [
        {
          source_hash: "a1b2c3d4",
          title:
            "Why Israel's attacks on Lebanon could cripple US-Iran ceasefire",
          link: "https://www.aljazeera.com/news/2026/4/9/...",
          published: "Thu, 09 Apr 2026 10:57:56 +0000",
          description:
            "Ceasefire dispute escalates as US and Israel exclude Lebanon, raising fears of a broader regional conflict. The exclusion of Lebanon from the truce agreement has sparked diplomatic tensions.",
          feed_category: "non_western",
          feed_bias: "global_south",
          feed_region: "middle_east",
          source: "Al Jazeera",
          fetched_at: "2026-04-09T11:00:00Z",
          ai_summary:
            "Israel's Lebanon strikes threaten US-Iran truce stability",
          ai_framing: "regional escalation focus",
          ai_loaded_terms: "cripple, broader conflict, diplomatic tensions",

        },
        {

          title:
            "NATO Secretary General unable to protect alliance — Russian presidential envoy",
          link: "https://tass.com/politics/2114281",
          published: "Thu, 09 Apr 2026 13:10:55 +0300",
          description:
            "Kirill Dmitriev commented on Mark Rutte's agreement with US President Donald Trump regarding NATO's failure. The Russian envoy highlighted structural weaknesses in the alliance.",
          feed_category: "eastern",
          feed_bias: "pro_kremlin",
          feed_region: "russia",
          source: "TASS",
          fetched_at: "2026-04-09T11:00:00Z",
          ai_summary:
            "Russia criticizes NATO leadership over alliance cohesion",
          ai_framing: "alliance weakness narrative",
          ai_loaded_terms: "unable, failure, structural weaknesses",
        },
      ];

      // Event clusters for comparison
      const eventClusters = [
        {
          id: "lebanon-strikes",
          title: "Israeli strikes on Lebanon post-ceasefire",
          articles: ["a1b2c3d4", "b2c3d4e5", "c3d4e5f6", "d4e5f6g7"],
          sources: ["aljazeera", "bbc", "tass"],
        },
        {
          id: "trump-nato",
          title: "Trump-NATO tensions over Iran",
          articles: ["e5f6g7h8", "f6g7h8i9"],
          sources: ["bbc", "aljazeera"],
        },
        {
          id: "hormuz",
          title: "Strait of Hormuz shipping crisis",
          articles: ["g7h8i9j0", "h8i9j0k1", "i9j0k1l2"],
          sources: ["bbc", "tass", "aljazeera"],
        },
      ];

      // State
      let currentFilter = "all";
      let currentView = "feed";
      let searchQuery = "";

      // DOM Elements
      const feedContainer = document.getElementById("feedContainer");
      const comparisonView = document.getElementById("comparisonView");
      const comparisonGrid = document.getElementById("comparisonGrid");
      const perspectiveList = document.getElementById("perspectiveList");
      const eventClustersEl = document.getElementById("eventClusters");
      const biasDistributionEl = document.getElementById("biasDistribution");
      const modalOverlay = document.getElementById("modalOverlay");
      const modalBody = document.getElementById("modalBody");
      const modalClose = document.getElementById("modalClose");
      const searchInput = document.getElementById("searchInput");
      const liveCount = document.getElementById("liveCount");

      // Initialize
      function init() {
        renderPerspectiveList();
        renderEventClusters();
        renderBiasDistribution();
        renderFeed();
        updateLiveCount();
        setupEventListeners();
      }

      // Render perspective list
      function renderPerspectiveList() {
        const perspectives = [
          {
            id: "all",
            name: "All Sources",
            color: "#64748b",
            count: mockArticles.length,
          },
          { id: "wire", name: "Wire Services", color: "#f59e0b", count: 0 },
          {
            id: "western",
            name: "Western",
            color: "#3b82f6",
            count: mockArticles.filter((a) => a.feed_category === "western")
              .length,
          },
          {
            id: "non_western",
            name: "Non-Western",
            color: "#10b981",
            count: mockArticles.filter((a) => a.feed_category === "non_western")
              .length,
          },
          {
            id: "eastern",
            name: "Eastern",
            color: "#ef4444",
            count: mockArticles.filter((a) => a.feed_category === "eastern")
              .length,
          },
        ];

        perspectiveList.innerHTML = perspectives
          .map(
            (p) => `
                <div class="perspective-item ${currentFilter === p.id ? "active" : ""}" data-perspective="${p.id}">
                    <div class="perspective-left">
                        <span class="perspective-dot" style="background: ${p.color}"></span>
                        <span class="perspective-name">${p.name}</span>
                    </div>
                    <span class="perspective-count">${p.count}</span>
                </div>
            `,
          )
          .join("");
      }

      // Render event clusters
      function renderEventClusters() {
        eventClustersEl.innerHTML = eventClusters
          .map(
            (cluster) => `
                <div class="cluster-item" data-cluster="${cluster.id}">
                    <div class="cluster-title">${cluster.title}</div>
                    <div class="cluster-meta">
                        <span>${cluster.articles.length} sources</span>
                        <div class="cluster-sources">
                            ${cluster.sources.map((s) => `<span class="cluster-source-dot source-avatar ${s}" style="width: 8px; height: 8px; font-size: 0;"></span>`).join("")}
                        </div>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      // Render bias distribution
      function renderBiasDistribution() {
        const biases = [
          { label: "Wire/Neutral", color: "#f59e0b", count: 0 },
          {
            label: "Western",
            color: "#3b82f6",
            count: mockArticles.filter((a) => a.feed_category === "western")
              .length,
          },
          {
            label: "Non-Western",
            color: "#10b981",
            count: mockArticles.filter((a) => a.feed_category === "non_western")
              .length,
          },
          {
            label: "Eastern",
            color: "#ef4444",
            count: mockArticles.filter((a) => a.feed_category === "eastern")
              .length,
          },
        ];

        const maxCount = Math.max(...biases.map((b) => b.count));

        biasDistributionEl.innerHTML = biases
          .map(
            (b) => `
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span style="width: 80px; font-size: 0.75rem; color: var(--text-muted); text-align: right;">${b.label}</span>
                    <div style="flex: 1; height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden;">
                        <div style="width: ${maxCount > 0 ? (b.count / maxCount) * 100 : 0}%; height: 100%; background: ${b.color}; border-radius: 4px; transition: width 0.3s;"></div>
                    </div>
                    <span style="width: 24px; font-size: 0.75rem; color: var(--text-muted); text-align: right;">${b.count}</span>
                </div>
            `,
          )
          .join("");
      }

      // Filter articles
      function getFilteredArticles() {
        let articles = mockArticles;

        if (currentFilter !== "all") {
          articles = articles.filter((a) => a.feed_category === currentFilter);
        }

        if (searchQuery) {
          const query = searchQuery.toLowerCase();
          articles = articles.filter(
            (a) =>
              a.title.toLowerCase().includes(query) ||
              a.description.toLowerCase().includes(query) ||
              a.source.toLowerCase().includes(query) ||
              (a.ai_summary && a.ai_summary.toLowerCase().includes(query)),
          );
        }

        return articles;
      }

      // Render feed
      function renderFeed() {
        const articles = getFilteredArticles();

        if (articles.length === 0) {
          feedContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>No articles found</h3>
                        <p>Try adjusting your filters or search query</p>
                    </div>
                `;
          return;
        }

        feedContainer.innerHTML = articles
          .map(
            (article) => `
                <div class="article-card" data-hash="${article.source_hash}" onclick="openModal('${article.source_hash}')">
                    <div class="article-header">
                        <div class="article-source">
                            <div class="source-avatar ${article.source.toLowerCase().replace(" ", "")}">
                                ${article.source.charAt(0)}
                            </div>
                            <div class="source-info">
                                <span class="source-name">${article.source}</span>
                                <span class="source-meta">${article.feed_region} · ${article.feed_category}</span>
                            </div>
                        </div>
                        <span class="article-bias-badge ${article.feed_category}">${article.feed_category.replace("_", " ")}</span>
                    </div>
                    <h3 class="article-title">${article.title}</h3>
                    <p class="article-description">${article.description}</p>
                    <div class="article-footer">
                        <div class="article-tags">
                            ${
                              article.ai_loaded_terms
                                ? article.ai_loaded_terms
                                    .split(", ")
                                    .slice(0, 3)
                                    .map(
                                      (term) =>
                                        `<span class="article-tag">${term}</span>`,
                                    )
                                    .join("")
                                : ""
                            }
                        </div>
                        <span class="article-time">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            ${formatTime(article.published)}
                        </span>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      // Render comparison view
      function renderComparison() {
        const perspectives = [
          {
            id: "western",
            name: "Western Perspective",
            color: "#3b82f6",
            articles: mockArticles.filter((a) => a.feed_category === "western"),
          },
          {
            id: "non_western",
            name: "Non-Western Perspective",
            color: "#10b981",
            articles: mockArticles.filter(
              (a) => a.feed_category === "non_western",
            ),
          },
          {
            id: "eastern",
            name: "Eastern Perspective",
            color: "#ef4444",
            articles: mockArticles.filter((a) => a.feed_category === "eastern"),
          },
        ];

        comparisonGrid.innerHTML = perspectives
          .map(
            (p) => `
                <div class="comparison-column">
                    <div class="comparison-header">
                        <span class="perspective-dot" style="background: ${p.color}"></span>
                        <h3>${p.name}</h3>
                        <span style="margin-left: auto; font-size: 0.75rem; color: var(--text-muted);">${p.articles.length} articles</span>
                    </div>
                    <div class="comparison-articles">
                        ${p.articles
                          .map(
                            (a) => `
                            <div class="comparison-article">
                                <div class="comparison-article-title">${a.title}</div>
                                <div class="comparison-article-desc">${a.description}</div>
                                <div class="framing-indicator">
                                    <strong>Framing:</strong> ${a.ai_framing || "N/A"}
                                </div>
                            </div>
                        `,
                          )
                          .join("")}
                        ${p.articles.length === 0 ? '<p style="font-size: 0.8125rem; color: var(--text-muted); text-align: center; padding: 2rem 0;">No articles from this perspective</p>' : ""}
                    </div>
                </div>
            `,
          )
          .join("");
      }

      // Open modal
      function openModal(hash) {
        const article = mockArticles.find((a) => a.source_hash === hash);
        if (!article) return;

        modalBody.innerHTML = `
                <div class="modal-article-source">
                    <div class="source-avatar ${article.source.toLowerCase().replace(" ", "")}">${article.source.charAt(0)}</div>
                    <div>
                        <div style="font-weight: 600;">${article.source}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">${article.feed_region} · ${article.feed_category}</div>
                    </div>
                    <span class="article-bias-badge ${article.feed_category}" style="margin-left: auto;">${article.feed_category.replace("_", " ")}</span>
                </div>
                <h2 class="modal-title">${article.title}</h2>
                <p class="modal-description">${article.description}</p>
                ${
                  article.ai_summary
                    ? `
                    <div style="background: var(--bg-tertiary); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border-left: 3px solid var(--accent-purple);">
                        <div style="font-size: 0.75rem; color: var(--accent-purple); font-weight: 600; margin-bottom: 0.25rem;">AI Analysis</div>
                        <div style="font-size: 0.875rem; color: var(--text-secondary);">${article.ai_summary}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.375rem;">
                            <strong>Framing:</strong> ${article.ai_framing}
                        </div>
                    </div>
                `
                    : ""
                }
                <div class="modal-meta">
                    <span>📅 ${new Date(article.published).toLocaleDateString()}</span>
                    <span>️ ${article.feed_region}</span>
                    <span>📊 ${article.feed_category}</span>
                </div>
                ${
                  article.ai_loaded_terms
                    ? `
                    <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem;">Loaded Terms Detected</div>
                        <div style="display: flex; gap: 0.375rem; flex-wrap: wrap;">
                            ${article.ai_loaded_terms
                              .split(", ")
                              .map(
                                (term) =>
                                  `<span class="article-tag">${term}</span>`,
                              )
                              .join("")}
                        </div>
                    </div>
                `
                    : ""
                }
            `;

        modalOverlay.classList.add("active");
      }

      // Close modal
      function closeModal() {
        modalOverlay.classList.remove("active");
      }

      // Format time
      function formatTime(dateStr) {
        const date = new Date(dateStr);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        if (diffMins < 1) return "Just now";
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        return date.toLocaleDateString();
      }

      // Update live count
      function updateLiveCount() {
        liveCount.textContent = `${mockArticles.length} articles`;
      }

      // Event listeners
      function setupEventListeners() {
        // Filter buttons
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            document
              .querySelectorAll(".filter-btn")
              .forEach((b) => b.classList.remove("active"));
            e.currentTarget.classList.add("active");
            currentFilter = e.currentTarget.dataset.filter;
            renderPerspectiveList();
            renderFeed();
          });
        });

        // View toggle
        document.querySelectorAll(".view-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            document
              .querySelectorAll(".view-btn")
              .forEach((b) => b.classList.remove("active"));
            e.currentTarget.classList.add("active");
            currentView = e.currentTarget.dataset.view;

            if (currentView === "feed") {
              feedContainer.style.display = "flex";
              comparisonView.classList.remove("active");
              renderFeed();
            } else {
              feedContainer.style.display = "none";
              comparisonView.classList.add("active");
              renderComparison();
            }
          });
        });

        // Perspective sidebar items
        perspectiveList.addEventListener("click", (e) => {
          const item = e.target.closest(".perspective-item");
          if (!item) return;
          const perspective = item.dataset.perspective;
          currentFilter = perspective;
          document.querySelectorAll(".filter-btn").forEach((b) => {
            b.classList.toggle("active", b.dataset.filter === perspective);
          });
          renderPerspectiveList();
          renderFeed();
        });

        // Search
        searchInput.addEventListener("input", (e) => {
          searchQuery = e.target.value;
          renderFeed();
        });

        // Modal close
        modalClose.addEventListener("click", closeModal);
        modalOverlay.addEventListener("click", (e) => {
          if (e.target === modalOverlay) closeModal();
        });

        // Keyboard shortcuts
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeModal();
          if (e.key === "/" && document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
          }
        });
      }

      // Start
      init();
    </script>
  </body>
