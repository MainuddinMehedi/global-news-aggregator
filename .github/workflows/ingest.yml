name: News Ingestion Pipeline

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Allows manual trigger from the Actions tab
    inputs:
      ai_limit:
        description: "Max articles to process with AI"
        required: false
        default: "20"

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"

      - name: Run Ingestion Script
        env:
          # Shell inputs
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
          AI_LIMIT_INPUT: "${{ github.event.inputs.ai_limit }}"

          # 🔐 SECRETS (Sensitive)
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          MISTRAL_API_KEY: "${{ secrets.MISTRAL_API_KEY }}"
          GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
          REVALIDATE_SECRET: "${{ secrets.REVALIDATE_SECRET }}"

          # ⚙️ VARIABLES (Config)
          NEXT_PUBLIC_API_URL: "${{ vars.NEXT_PUBLIC_API_URL }}"
          
          MISTRAL_BASE_URL: "${{ vars.MISTRAL_BASE_URL }}"
          GROQ_BASE_URL: "${{ vars.GROQ_BASE_URL }}"

          AI_PIPELINE_MODEL: "${{ vars.AI_PIPELINE_MODEL }}"
          AI_PIPELINE_FALLBACK_MODEL: "${{ vars.AI_PIPELINE_FALLBACK_MODEL }}"

          AI_MISTRAL_TPM_LIMIT: "${{ vars.AI_MISTRAL_TPM_LIMIT }}"
          AI_MISTRAL_RPM_LIMIT: "${{ vars.AI_MISTRAL_RPM_LIMIT }}"
          AI_MISTRAL_CONCURRENCY: "${{ vars.AI_MISTRAL_CONCURRENCY }}"
          AI_MISTRAL_BATCH_SIZE: "${{ vars.AI_MISTRAL_BATCH_SIZE }}"

          AI_GROQ_TPM_LIMIT: "${{ vars.AI_GROQ_TPM_LIMIT }}"
          AI_GROQ_RPM_LIMIT: "${{ vars.AI_GROQ_RPM_LIMIT }}"
          AI_GROQ_CONCURRENCY: "${{ vars.AI_GROQ_CONCURRENCY }}"
          AI_GROQ_BATCH_SIZE: "${{ vars.AI_GROQ_BATCH_SIZE }}"

          AI_TOKEN_MULTIPLIER: "${{ vars.AI_TOKEN_MULTIPLIER }}"
          AI_TIMEOUT_MS: "${{ vars.AI_TIMEOUT_MS }}"
          AI_RETRY_ATTEMPTS: "${{ vars.AI_RETRY_ATTEMPTS }}"
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ -n "$AI_LIMIT_INPUT" ]; then
            npm run ingest -- --ai-limit=$AI_LIMIT_INPUT
          else
            npm run ingest
          fi
