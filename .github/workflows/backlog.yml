name: Daily Backlog Processing

on:
  schedule:
    # Runs once a day at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual trigger
    inputs:
      limit:
        description: 'Max articles to process from backlog'
        required: false
        default: '100'

jobs:
  backlog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"

      - name: Run Backlog Script
        env:
          # Shell inputs
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
          LIMIT_INPUT: "${{ github.event.inputs.limit }}"

          # 🔐 SECRETS (Sensitive)
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          AI_PRIMARY_API_KEY: "${{ secrets.AI_PRIMARY_API_KEY }}"
          AI_FALLBACK_API_KEY: "${{ secrets.AI_FALLBACK_API_KEY }}"
          REVALIDATE_SECRET: "${{ secrets.REVALIDATE_SECRET }}"

          # ⚙️ VARIABLES (Config)
          NEXT_PUBLIC_API_URL: "${{ vars.NEXT_PUBLIC_API_URL }}"
          AI_PRIMARY_PROVIDER: "${{ vars.AI_PRIMARY_PROVIDER }}"
          AI_PRIMARY_MODEL: "${{ vars.AI_PRIMARY_MODEL }}"
          AI_PRIMARY_BASE_URL: "${{ vars.AI_PRIMARY_BASE_URL }}"

          AI_FALLBACK_PROVIDER: "${{ vars.AI_FALLBACK_PROVIDER }}"
          AI_FALLBACK_MODEL: "${{ vars.AI_FALLBACK_MODEL }}"
          AI_FALLBACK_BASE_URL: "${{ vars.AI_FALLBACK_BASE_URL }}"

          AI_TPM_LIMIT: "${{ vars.AI_TPM_LIMIT }}"
          AI_RPM_LIMIT: "${{ vars.AI_RPM_LIMIT }}"
          AI_TOKEN_MULTIPLIER: "${{ vars.AI_TOKEN_MULTIPLIER }}"
          AI_BATCH_SIZE: "${{ vars.AI_BATCH_SIZE }}"
          AI_CONCURRENCY_LIMIT: "${{ vars.AI_CONCURRENCY_LIMIT }}"
          AI_TIMEOUT_MS: "${{ vars.AI_TIMEOUT_MS }}"
          AI_RETRY_ATTEMPTS: "${{ vars.AI_RETRY_ATTEMPTS }}"
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ -n "$LIMIT_INPUT" ]; then
            npm run backlog -- --limit=$LIMIT_INPUT
          else
            npm run backlog -- --limit=100
          fi
