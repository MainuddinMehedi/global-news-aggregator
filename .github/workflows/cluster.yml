name: Story Clustering Pipeline

on:
  schedule:
    # Runs every hour at minute 45
    # Staggers away from ingestion (:00, :30), backlog (3:00), and topics (:15)
    - cron: "45 * * * *"
  workflow_dispatch:
    # Allows manual trigger from the Actions tab

jobs:
  cluster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"

      - name: Run Story Clustering Script
        env:
          # 🔐 SECRETS (Sensitive)
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          MISTRAL_API_KEY: "${{ secrets.MISTRAL_API_KEY }}"
          GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
          REVALIDATE_SECRET: "${{ secrets.REVALIDATE_SECRET }}"

          # ⚙️ VARIABLES (Config)
          NEXT_PUBLIC_API_URL: "${{ vars.NEXT_PUBLIC_API_URL }}"
          
          MISTRAL_BASE_URL: "${{ vars.MISTRAL_BASE_URL }}"
          GROQ_BASE_URL: "${{ vars.GROQ_BASE_URL }}"

          AI_PIPELINE_MODEL: "${{ vars.AI_PIPELINE_MODEL }}"
          AI_PIPELINE_FALLBACK_MODEL: "${{ vars.AI_PIPELINE_FALLBACK_MODEL }}"

          AI_MISTRAL_TPM_LIMIT: "${{ vars.AI_MISTRAL_TPM_LIMIT }}"
          AI_MISTRAL_RPM_LIMIT: "${{ vars.AI_MISTRAL_RPM_LIMIT }}"
          AI_MISTRAL_CONCURRENCY: "${{ vars.AI_MISTRAL_CONCURRENCY }}"
          AI_MISTRAL_BATCH_SIZE: "${{ vars.AI_MISTRAL_BATCH_SIZE }}"

          AI_GROQ_TPM_LIMIT: "${{ vars.AI_GROQ_TPM_LIMIT }}"
          AI_GROQ_RPM_LIMIT: "${{ vars.AI_GROQ_RPM_LIMIT }}"
          AI_GROQ_CONCURRENCY: "${{ vars.AI_GROQ_CONCURRENCY }}"
          AI_GROQ_BATCH_SIZE: "${{ vars.AI_GROQ_BATCH_SIZE }}"

          AI_TOKEN_MULTIPLIER: "${{ vars.AI_TOKEN_MULTIPLIER }}"
          AI_TIMEOUT_MS: "${{ vars.AI_TIMEOUT_MS }}"
          AI_RETRY_ATTEMPTS: "${{ vars.AI_RETRY_ATTEMPTS }}"

          # ⚙️ Clustering Tuning (optional overrides — all have code-level defaults)
          CLUSTER_ASSIGNMENT_MIN_CONFIDENCE: "${{ vars.CLUSTER_ASSIGNMENT_MIN_CONFIDENCE }}"
          AI_RESERVED_CLUSTERING_OUTPUT_TOKENS: "${{ vars.AI_RESERVED_CLUSTERING_OUTPUT_TOKENS }}"
        run: npm run cluster
