name: Locked Topics Scanner

on:
  schedule:
    # Runs every 2 hours at minute 15 (e.g., 0:15, 2:15, 4:15, etc.)
    # This staggers it away from ingestion (which runs at :00 and :30)
    # and backlog (which runs at 3:00) to prevent overlap and DB locks.
    - cron: "15 */2 * * *"
  workflow_dispatch:
    # Allows manual trigger for on-demand scanning or testing
    inputs:
      topic_id:
        description: "Specific Topic ID to scan (leave blank to scan all active)"
        required: false
        default: ""

jobs:
  scan-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"

      - name: Run Locked Topics Scanner
        env:
          # Shell inputs
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
          TOPIC_ID_INPUT: "${{ github.event.inputs.topic_id }}"

          # 🔐 SECRETS (Sensitive)
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          REVALIDATE_SECRET: "${{ secrets.REVALIDATE_SECRET }}"

          # AI Keys
          GROQ_API_KEY: "${{ secrets.AI_PRIMARY_API_KEY }}"
          GEMINI_API_KEY: "${{ secrets.AI_FALLBACK_API_KEY }}"

          # External Scanners & APIs
          BRAVE_API_KEY: "${{ secrets.BRAVE_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" # Native token or custom PAT

          # Notification Channels
          DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}"
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"

          # ⚙️ VARIABLES (Config)
          NEXT_PUBLIC_API_URL: "${{ vars.NEXT_PUBLIC_API_URL }}"

          GROQ_BASE_URL: "${{ vars.AI_PRIMARY_BASE_URL }}"
          GEMINI_BASE_URL: "${{ vars.AI_FALLBACK_BASE_URL }}"

          AI_INGESTION_MODEL: "${{ vars.AI_PRIMARY_MODEL }}"
          AI_GEMINI_FALLBACK_MODEL: "${{ vars.AI_FALLBACK_MODEL }}"

          AI_SUMMARY_MODEL: "${{ vars.AI_SUMMARY_MODEL }}"

          AI_TIMEOUT_MS: "${{ vars.AI_TIMEOUT_MS }}"
          AI_RETRY_ATTEMPTS: "${{ vars.AI_RETRY_ATTEMPTS }}"
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ -n "$TOPIC_ID_INPUT" ]; then
            npm run scan-topics -- --topic-id="$TOPIC_ID_INPUT"
          else
            npm run scan-topics
          fi
